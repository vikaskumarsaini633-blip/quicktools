<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter - CLV Tools</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🔄 Unit Converter</h1>
    <p>Length, Weight, Temperature और Volume को आसानी से convert करें।</p>

    <div class="tool-card">

      <input type="number" id="unitValue" placeholder="Value">

      <select id="category" onchange="loadUnits()">
        <option value="length">📏 Length</option>
        <option value="weight">⚖️ Weight</option>
        <option value="temperature">🌡️ Temperature</option>
        <option value="volume">💧 Volume</option>
      </select>

      <select id="fromUnit"></select>

      <select id="toUnit"></select>

      <button onclick="convertUnit()">Convert</button>

      <div id="result"></div>

    </div>

    <a href="index.html">⬅️ Back to Home</a>

  </div>


<script>

const units = {

  length: {
    Meter: 1,
    Kilometer: 1000,
    Centimeter: 0.01,
    Millimeter: 0.001,
    Foot: 0.3048,
    Inch: 0.0254
  },

  weight: {
    Kilogram: 1,
    Gram: 0.001,
    Milligram: 0.000001,
    Pound: 0.453592,
    Ounce: 0.0283495
  },

  volume: {
    Liter: 1,
    Milliliter: 0.001,
    "Cubic Meter": 1000,
    Gallon: 3.78541
  }

};


function loadUnits() {

  const category =
    document.getElementById("category").value;

  const from =
    document.getElementById("fromUnit");

  const to =
    document.getElementById("toUnit");

  from.innerHTML = "";
  to.innerHTML = "";

  if (category === "temperature") {

    const temperatureUnits =
      ["Celsius", "Fahrenheit", "Kelvin"];

    temperatureUnits.forEach(unit => {

      from.innerHTML +=
        `<option value="${unit}">${unit}</option>`;

      to.innerHTML +=
        `<option value="${unit}">${unit}</option>`;

    });

  } else {

    Object.keys(units[category]).forEach(unit => {

      from.innerHTML +=
        `<option value="${unit}">${unit}</option>`;

      to.innerHTML +=
        `<option value="${unit}">${unit}</option>`;

    });

  }

}


function convertUnit() {

  const value =
    parseFloat(document.getElementById("unitValue").value);

  const category =
    document.getElementById("category").value;

  const from =
    document.getElementById("fromUnit").value;

  const to =
    document.getElementById("toUnit").value;

  const result =
    document.getElementById("result");


  if (isNaN(value)) {

    result.innerHTML =
      "⚠️ Please enter a value.";

    return;

  }


  let converted;


  if (category === "temperature") {

    let celsius;

    if (from === "Celsius") {
      celsius = value;
    }

    else if (from === "Fahrenheit") {
      celsius = (value - 32) * 5 / 9;
    }

    else {
      celsius = value - 273.15;
    }


    if (to === "Celsius") {
      converted = celsius;
    }

    else if (to === "Fahrenheit") {
      converted = (celsius * 9 / 5) + 32;
    }

    else {
      converted = celsius + 273.15;
    }

  }

  else {

    converted =
      value *
      units[category][from] /
      units[category][to];

  }


  result.innerHTML =
    `✅ ${value} ${from} = 
    <strong>${converted.toFixed(4)} ${to}</strong>`;

}


loadUnits();

</script>

</body>
</html>
