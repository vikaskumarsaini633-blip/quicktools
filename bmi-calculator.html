<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BMI Calculator - QuickTools</title>

<meta name="description"
content="Calculate BMI online for free with QuickTools.">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>⚡ QuickTools</h1>

<p>Free Online Tools</p>

</header>


<main>

<a href="index.html">

<button>
← Back to Home
</button>

</a>


<section class="compressor">

<h2>⚖️ BMI Calculator</h2>

<p>
अपना वजन और height डालकर BMI calculate करें।
</p>


<input
type="number"
id="weight"
placeholder="Weight (kg)"
step="0.1"
>


<br><br>


<input
type="number"
id="height"
placeholder="Height (cm)"
step="0.1"
>


<br><br>


<button onclick="calculateBMI()">
Calculate BMI
</button>


<div id="result"></div>

</section>

</main>


<footer>

<p>
© 2026 QuickTools
</p>

</footer>


<script>

function calculateBMI(){

const weight =
parseFloat(
document.getElementById("weight").value
);

const heightCm =
parseFloat(
document.getElementById("height").value
);


if(
isNaN(weight) ||
isNaN(heightCm) ||
weight <= 0 ||
heightCm <= 0
){

alert(
"सही Weight और Height डालें"
);

return;

}


const height =
heightCm / 100;

const bmi =
weight / (height * height);


let category;


if(bmi < 18.5){

category = "Underweight";

}else if(bmi < 25){

category = "Normal";

}else if(bmi < 30){

category = "Overweight";

}else{

category = "Obesity";

}


document.getElementById("result")
.innerHTML = `

<div class="result-box">

<h3>Your BMI</h3>

<p>
<strong>
${bmi.toFixed(1)}
</strong>
</p>

<p>
Category:
<strong>
${category}
</strong>
</p>

</div>

`;

}

</script>


</body>

</html>
