<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QR Code Generator - QuickTools</title>

<meta name="description"
content="Create QR codes online for free with QuickTools.">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>⚡ QuickTools</h1>

<p>Free Online Tools</p>

</header>


<main>

<a href="index.html">

<button>
← Back to Home
</button>

</a>


<section class="compressor">

<h2>🔳 QR Code Generator</h2>

<p>
Text या URL डालकर अपना QR Code बनाएँ।
</p>


<input
type="text"
id="qrText"
placeholder="https://example.com"
>


<br><br>


<button onclick="generateQR()">
Generate QR Code
</button>


<div id="qrResult"></div>

</section>

</main>


<footer>

<p>
© 2026 QuickTools
</p>

</footer>


<script>

function generateQR(){

const text =
document.getElementById(
"qrText"
).value.trim();


if(!text){

alert(
"पहले Text या URL डालें"
);

return;

}


const qrURL =
"https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="
+
encodeURIComponent(text);


document.getElementById(
"qrResult"
).innerHTML = `

<br>

<img
src="${qrURL}"
alt="QR Code"
width="300"
height="300"
>

<br><br>

<a
href="${qrURL}"
download="quicktools-qr.png"
>

<button>
⬇️ Download QR Code
</button>

</a>

`;

}

</script>


</body>

</html>
